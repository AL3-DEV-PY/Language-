name: Build LinguaX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LinguaX Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 4. Install Android SDK components
      # ==========================================
      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================
      # 5. Download Gradle DIRECTLY
      #
      # IMPORTANT:
      # No gradle/actions/setup-gradle
      # No Gradle Wrapper
      # No gradle-wrapper.jar
      # ==========================================
      - name: Install Gradle 9.3.1 Directly
        run: |
          set -e

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle"

          echo "Installing Gradle $GRADLE_VERSION..."

          rm -rf "$GRADLE_DIR"
          mkdir -p "$GRADLE_DIR"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$HOME/gradle.zip"

          unzip -q \
            "$HOME/gradle.zip" \
            -d "$GRADLE_DIR"

          rm -f "$HOME/gradle.zip"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          echo "Gradle installed successfully."

      # ==========================================
      # 6. Verify Java + Gradle
      # ==========================================
      - name: Verify Build Tools
        run: |
          echo "================================"
          echo "JAVA"
          echo "================================"

          java -version

          echo ""
          echo "================================"
          echo "GRADLE"
          echo "================================"

          gradle --version

          echo ""
          echo "================================"
          echo "ANDROID SDK"
          echo "================================"

          echo "ANDROID_HOME=$ANDROID_HOME"

      # ==========================================
      # 7. Remove broken Gradle Wrapper
      # ==========================================
      - name: Remove Broken Gradle Wrapper
        run: |
          echo "Removing corrupted Gradle Wrapper files..."

          rm -f gradlew
          rm -f gradlew.bat
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradle/wrapper/gradle-wrapper.properties

          echo "Gradle Wrapper removed."

      # ==========================================
      # 8. Configure Android SDK
      # ==========================================
      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "local.properties:"
          cat local.properties

      # ==========================================
      # 9. Verify project structure
      # ==========================================
      - name: Verify Android Project
        run: |
          echo "================================"
          echo "PROJECT STRUCTURE"
          echo "================================"

          pwd

          echo ""
          ls -la

          echo ""

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project structure is valid."

      # ==========================================
      # 10. Remove problematic Gradle properties
      # ==========================================
      - name: Configure Gradle
        run: |
          touch gradle.properties

          if ! grep -q "^org.gradle.daemon=" gradle.properties; then
            echo "org.gradle.daemon=false" >> gradle.properties
          fi

          if ! grep -q "^org.gradle.configuration-cache=" gradle.properties; then
            echo "org.gradle.configuration-cache=false" >> gradle.properties
          fi

          echo ""
          echo "Gradle properties:"
          cat gradle.properties

      # ==========================================
      # 11. Clean project
      # ==========================================
      - name: Clean Project
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================
      # 12. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================
      # 13. Find APK
      # ==========================================
      - name: Find APK
        run: |
          echo "Searching for generated APK..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      # ==========================================
      # 14. Prepare LinguaX APK
      # ==========================================
      - name: Prepare LinguaX APK
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "APK found:"
          echo "$APK"

          cp "$APK" release/LinguaX-debug.apk

          echo ""
          echo "Final APK:"
          ls -lh release/LinguaX-debug.apk

      # ==========================================
      # 15. Upload APK
      # ==========================================
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: release/LinguaX-debug.apk
          if-no-files-found: error
          retention-days: 30
