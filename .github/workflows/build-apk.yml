name: Build LinguaX APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # 3. تثبيت Gradle
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      # 4. إنشاء ملف .env من GitHub Secrets
      - name: Create environment file
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          cat > .env <<EOF
          SUPABASE_URL=${SUPABASE_URL}
          SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
          EOF

      # 5. إنشاء debug.keystore
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 6. التأكد من وجود مشروع Android
      - name: Check Android project
        run: |
          echo "Current directory:"
          pwd

          echo "Project files:"
          ls -la

          echo "App directory:"
          ls -la app

      # 7. بناء APK باستخدام Gradle المثبت
      - name: Build Debug APK
        run: |
          gradle :app:assembleDebug --stacktrace

      # 8. البحث عن APK
      - name: Find APK
        run: |
          echo "Searching for APK..."
          find app/build/outputs -type f -name "*.apk" -print

      # 9. رفع APK إلى GitHub
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
