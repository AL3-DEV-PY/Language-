name: Build LinguaX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build LinguaX Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout Repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Setup Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 4. Install Android SDK components
      # ==========================================
      - name: Install Android SDK Components
        run: |
          set -e

          yes | sdkmanager --licenses || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0"

      # ==========================================
      # 5. Install Gradle directly
      # ==========================================
      # We intentionally DO NOT use:
      # gradle/actions/setup-gradle
      #
      # This avoids the corrupted/invalid
      # gradle-wrapper.jar problem.
      # ==========================================
      - name: Install Gradle 9.3.1 Directly
        run: |
          set -e

          GRADLE_VERSION="9.3.1"
          GRADLE_DIR="$HOME/gradle"

          echo "Installing Gradle $GRADLE_VERSION..."

          rm -rf "$GRADLE_DIR"
          mkdir -p "$GRADLE_DIR"

          wget -q \
            "https://services.gradle.org/distributions/gradle-${GRADLE_VERSION}-bin.zip" \
            -O "$HOME/gradle.zip"

          unzip -q \
            "$HOME/gradle.zip" \
            -d "$GRADLE_DIR"

          rm -f "$HOME/gradle.zip"

          echo "$GRADLE_DIR/gradle-${GRADLE_VERSION}/bin" >> "$GITHUB_PATH"

          echo "Gradle installation completed."

      # ==========================================
      # 6. Verify Java / Gradle / Android
      # ==========================================
      - name: Verify Build Environment
        run: |
          set -e

          echo "========================================"
          echo "JAVA VERSION"
          echo "========================================"

          java -version

          echo ""
          echo "========================================"
          echo "GRADLE VERSION"
          echo "========================================"

          gradle --version

          echo ""
          echo "========================================"
          echo "ANDROID SDK"
          echo "========================================"

          echo "ANDROID_HOME=$ANDROID_HOME"

          echo ""
          echo "========================================"
          echo "ADB"
          echo "========================================"

          adb version

      # ==========================================
      # 7. Remove corrupted Gradle Wrapper
      # ==========================================
      - name: Remove Broken Gradle Wrapper
        run: |
          echo "Removing broken Gradle Wrapper..."

          rm -f gradlew
          rm -f gradlew.bat
          rm -f gradle/wrapper/gradle-wrapper.jar
          rm -f gradle/wrapper/gradle-wrapper.properties

          echo "Broken Gradle Wrapper removed."

      # ==========================================
      # 8. Configure Android SDK
      # ==========================================
      - name: Configure Android SDK
        run: |
          set -e

          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Created local.properties:"
          cat local.properties

      # ==========================================
      # 9. Verify Android project
      # ==========================================
      - name: Verify Android Project
        run: |
          set -e

          echo "========================================"
          echo "PROJECT ROOT"
          echo "========================================"

          pwd

          echo ""
          echo "========================================"
          echo "PROJECT FILES"
          echo "========================================"

          ls -la

          echo ""
          echo "========================================"
          echo "ANDROID PROJECT CHECK"
          echo "========================================"

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo "Android project structure is valid."

      # ==========================================
      # 10. Create Debug Keystore
      # ==========================================
      # The application currently expects:
      #
      # /home/runner/work/Language-/Language-/debug.keystore
      #
      # Therefore we create it in the repository root.
      # ==========================================
      - name: Create Debug Keystore
        run: |
          set -e

          echo "========================================"
          echo "CREATING DEBUG KEYSTORE"
          echo "========================================"

          rm -f debug.keystore

          keytool -genkeypair \
            -v \
            -keystore debug.keystore \
            -alias androiddebugkey \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass android \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

          echo ""
          echo "========================================"
          echo "VERIFY DEBUG KEYSTORE"
          echo "========================================"

          ls -lh debug.keystore

          keytool -list \
            -keystore debug.keystore \
            -storepass android

          echo ""
          echo "Debug keystore created successfully."

      # ==========================================
      # 11. Configure Gradle
      # ==========================================
      - name: Configure Gradle
        run: |
          set -e

          touch gradle.properties

          if ! grep -q "^org.gradle.daemon=" gradle.properties; then
            echo "org.gradle.daemon=false" >> gradle.properties
          fi

          if ! grep -q "^org.gradle.configuration-cache=" gradle.properties; then
            echo "org.gradle.configuration-cache=false" >> gradle.properties
          fi

          echo "========================================"
          echo "GRADLE PROPERTIES"
          echo "========================================"

          cat gradle.properties

      # ==========================================
      # 12. Check signing configuration
      # ==========================================
      - name: Verify Signing Configuration
        run: |
          set -e

          echo "========================================"
          echo "SIGNING KEYSTORE"
          echo "========================================"

          test -f debug.keystore

          echo "debug.keystore exists."

          echo ""
          echo "Expected location:"
          pwd
          echo "/debug.keystore"

      # ==========================================
      # 13. Clean Project
      # ==========================================
      - name: Clean Project
        run: |
          set -e

          echo "Cleaning Android project..."

          gradle clean \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================
      # 14. Build Debug APK
      # ==========================================
      - name: Build Debug APK
        run: |
          set -e

          echo "========================================"
          echo "BUILDING LINGUAX APK"
          echo "========================================"

          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================
      # 15. Find generated APK
      # ==========================================
      - name: Find APK
        run: |
          set -e

          echo "========================================"
          echo "SEARCHING FOR APK"
          echo "========================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | wc -l)

          echo ""
          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

      # ==========================================
      # 16. Prepare APK
      # ==========================================
      - name: Prepare LinguaX APK
        run: |
          set -e

          mkdir -p release

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          echo "APK found:"
          echo "$APK"

          cp "$APK" release/LinguaX-debug.apk

          echo ""
          echo "========================================"
          echo "FINAL APK"
          echo "========================================"

          ls -lh release/LinguaX-debug.apk

      # ==========================================
      # 17. Upload APK
      # ==========================================
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: release/LinguaX-debug.apk
          if-no-files-found: error
          retention-days: 30
