name: Build LinguaX APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup JDK 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'


      # ==========================================
      # 4. Setup Node.js
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ==========================================
      # 5. Create Supabase environment
      # ==========================================
      - name: Create Supabase environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          cat > .env <<EOF
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          echo "Supabase environment created."


      # ==========================================
      # 6. Generate debug.keystore
      # ==========================================
      - name: Generate debug.keystore
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/debug.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "debug.keystore created successfully."


      # ==========================================
      # 7. Verify debug.keystore
      # ==========================================
      - name: Verify debug.keystore
        shell: bash
        run: |
          echo "Checking debug.keystore..."

          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "ERROR: debug.keystore was not created."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android

          echo "debug.keystore verified."


      # ==========================================
      # 8. Show Android project structure
      # ==========================================
      - name: Check Android project
        shell: bash
        run: |
          echo "===================================="
          echo "PROJECT ROOT"
          echo "===================================="

          pwd
          ls -la

          echo "===================================="
          echo "ANDROID APP"
          echo "===================================="

          ls -la app

          echo "===================================="
          echo "GRADLE FILES"
          echo "===================================="

          find . -maxdepth 3 \
            -type f \
            \( -name "build.gradle*" \
            -o -name "settings.gradle*" \
            -o -name "gradle.properties" \) \
            -print


      # ==========================================
      # 9. Build Android APK
      # ==========================================
      - name: Build APK with Gradle
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |

          echo "Starting Gradle build..."

          echo "Gradle version:"
          gradle --version

          echo "Current directory:"
          pwd

          echo "Checking keystore:"
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

          echo "Building APK..."

          gradle :app:assembleDebug \
            --stacktrace \
            --no-daemon \
            --console=plain


      # ==========================================
      # 10. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 11. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."


      # ==========================================
      # 12. Upload APK
      # ==========================================
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
