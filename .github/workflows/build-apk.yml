name: Build Android APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build LinguaX APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Setup Node.js
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      # 4. Create Supabase environment
      - name: Create Supabase environment
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}" >> .env

      # 5. Generate Android debug keystore
      - name: Generate debug.keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

      # 6. Verify debug keystore
      - name: Verify debug.keystore
        run: |
          echo "Checking debug.keystore..."
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "ERROR: debug.keystore was not created!"
            exit 1
          fi

          echo "debug.keystore exists successfully."

      # 7. Install Node dependencies
      - name: Install dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif [ -f package.json ]; then
            npm install
          else
            echo "No package.json found. Skipping npm dependencies."
          fi

      # 8. Build web application
      - name: Build web application
        run: |
          if [ -f package.json ]; then
            npm run build
          else
            echo "No package.json found. Skipping web build."
          fi

      # 9. Check Android project
      - name: Check Android project
        run: |
          echo "Repository:"
          pwd
          echo ""
          echo "Files:"
          ls -la
          echo ""
          echo "Android directories:"
          find . -maxdepth 3 -type d -name "app" -o -name "android"

      # 10. Make Gradle executable
      - name: Make Gradle executable
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
          elif [ -f ./android/gradlew ]; then
            chmod +x ./android/gradlew
          fi

      # 11. Build Android APK
      - name: Build APK with Gradle
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -f ./gradlew ]; then

            ./gradlew :app:assembleDebug \
              --stacktrace \
              --no-daemon

          elif [ -f ./android/gradlew ]; then

            cd android

            ./gradlew :app:assembleDebug \
              --stacktrace \
              --no-daemon

          else

            echo "ERROR: Gradle wrapper not found!"
            echo "Expected ./gradlew or ./android/gradlew"
            exit 1

          fi

      # 12. Find generated APK
      - name: Find APK
        run: |
          echo "Searching for APK files..."
          find . -type f -name "*.apk" -print

      # 13. Verify APK exists
      - name: Verify APK
        run: |
          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          echo "APK files found: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated!"
            exit 1
          fi

          echo "APK generated successfully."

      # 14. Upload APK
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
