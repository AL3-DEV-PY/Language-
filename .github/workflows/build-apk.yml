name: Build LinguaX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 3. Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 4. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==========================================
      # 5. Configure Android SDK
      # ==========================================
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Android SDK:"
          cat local.properties

      # ==========================================
      # 6. Verify project
      # ==========================================
      - name: Verify Android Project
        shell: bash
        run: |
          echo "======================================"
          echo "LinguaX Project"
          echo "======================================"

          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app

          echo ""
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo ""
          echo "Required Android files found."

      # ==========================================
      # 7. Check Gradle
      # ==========================================
      - name: Check Gradle Version
        run: |
          gradle --version

      # ==========================================
      # 8. Create debug keystore
      # ==========================================
      - name: Create Debug Keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cp "$HOME/.android/debug.keystore" ./debug.keystore

          echo "Debug keystore ready."

      # ==========================================
      # 9. Remove broken wrapper from build path
      # ==========================================
      - name: Disable Broken Gradle Wrapper
        shell: bash
        run: |
          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Broken/incomplete wrapper detected."
            echo "Global Gradle will be used by this workflow."
          fi

      # ==========================================
      # 10. Clean
      # ==========================================
      - name: Clean Project
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 11. Build APK
      # ==========================================
      - name: Build APK with Gradle
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================
      # 12. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          echo "======================================"
          echo "Searching for generated APK"
          echo "======================================"

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: APK was not generated."
            exit 1
          fi

      # ==========================================
      # 13. Prepare APK
      # ==========================================
      - name: Prepare APK
        shell: bash
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" release/LinguaX-debug.apk

          echo "Generated APK:"
          ls -lh release/LinguaX-debug.apk

      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: release/LinguaX-debug.apk
          if-no-files-found: error
          retention-days: 30
