name: Build LinguaX APK

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Setup JDK 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'


      # ==========================================
      # 3. Setup Node.js
      # No npm cache because the project
      # does not contain package-lock.json
      # ==========================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'


      # ==========================================
      # 4. Detect package manager
      # ==========================================
      - name: Detect package manager
        id: package_manager
        shell: bash
        run: |
          if [ -f "pnpm-lock.yaml" ]; then
            echo "manager=pnpm" >> "$GITHUB_OUTPUT"
            echo "Package manager: pnpm"

          elif [ -f "yarn.lock" ]; then
            echo "manager=yarn" >> "$GITHUB_OUTPUT"
            echo "Package manager: yarn"

          elif [ -f "package-lock.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "Package manager: npm"

          elif [ -f "package.json" ]; then
            echo "manager=npm" >> "$GITHUB_OUTPUT"
            echo "Package manager: npm (no lockfile)"

          else
            echo "manager=none" >> "$GITHUB_OUTPUT"
            echo "No package.json found"

          fi


      # ==========================================
      # 5. Enable Corepack
      # ==========================================
      - name: Enable Corepack
        if: steps.package_manager.outputs.manager == 'pnpm' || steps.package_manager.outputs.manager == 'yarn'
        run: |
          corepack enable


      # ==========================================
      # 6. Setup pnpm
      # ==========================================
      - name: Setup pnpm
        if: steps.package_manager.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@v4
        with:
          version: 10


      # ==========================================
      # 7. Setup Supabase environment
      # ==========================================
      - name: Create Supabase environment
        shell: bash
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY secret is missing."
            exit 1
          fi

          cat > .env <<EOF
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          echo "Supabase environment created."


      # ==========================================
      # 8. Generate debug.keystore
      # ==========================================
      - name: Generate debug.keystore
        shell: bash
        run: |
          rm -f "$GITHUB_WORKSPACE/debug.keystore"

          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          echo "debug.keystore created."


      # ==========================================
      # 9. Verify debug.keystore
      # ==========================================
      - name: Verify debug.keystore
        shell: bash
        run: |
          echo "Checking debug.keystore..."

          if [ ! -f "$GITHUB_WORKSPACE/debug.keystore" ]; then
            echo "ERROR: debug.keystore was not created."
            exit 1
          fi

          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

          keytool -list \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android

          echo "debug.keystore verified successfully."


      # ==========================================
      # 10. Install JavaScript dependencies
      # ==========================================
      - name: Install dependencies
        if: steps.package_manager.outputs.manager != 'none'
        shell: bash
        run: |

          if [ "${{ steps.package_manager.outputs.manager }}" = "pnpm" ]; then

            pnpm install --frozen-lockfile

          elif [ "${{ steps.package_manager.outputs.manager }}" = "yarn" ]; then

            yarn install --immutable

          elif [ -f "package-lock.json" ]; then

            npm ci

          else

            npm install

          fi


      # ==========================================
      # 11. Build web application
      # ==========================================
      - name: Build web application
        if: steps.package_manager.outputs.manager != 'none'
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |

          if [ "${{ steps.package_manager.outputs.manager }}" = "pnpm" ]; then

            pnpm run build

          elif [ "${{ steps.package_manager.outputs.manager }}" = "yarn" ]; then

            yarn build

          else

            npm run build

          fi


      # ==========================================
      # 12. Check project structure
      # ==========================================
      - name: Check project structure
        shell: bash
        run: |
          echo "===================================="
          echo "Project root:"
          pwd
          echo "===================================="

          echo "Root files:"
          ls -la

          echo "===================================="

          echo "Searching for Gradle wrapper:"
          find . -maxdepth 4 -name "gradlew" -type f -print

          echo "===================================="

          echo "Searching for Android app:"
          find . -maxdepth 5 -type d -name "app" -print

          echo "===================================="


      # ==========================================
      # 13. Make Gradle executable
      # ==========================================
      - name: Make Gradle executable
        shell: bash
        run: |

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

          elif [ -f "./android/gradlew" ]; then

            chmod +x ./android/gradlew

          else

            echo "ERROR: Gradle wrapper not found."

            find . -maxdepth 5 -type f \
              \( -name "gradlew" -o -name "build.gradle" -o -name "build.gradle.kts" \) \
              -print

            exit 1

          fi


      # ==========================================
      # 14. Build Android APK
      # ==========================================
      - name: Build APK with Gradle
        shell: bash
        env:
          VITE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |

          if [ -f "./gradlew" ]; then

            echo "Using root Gradle wrapper."

            ./gradlew :app:assembleDebug \
              --stacktrace \
              --no-daemon

          elif [ -f "./android/gradlew" ]; then

            echo "Using Android Gradle wrapper."

            cd android

            ./gradlew :app:assembleDebug \
              --stacktrace \
              --no-daemon

          else

            echo "ERROR: No Gradle wrapper found."
            exit 1

          fi


      # ==========================================
      # 15. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          echo "Searching for generated APK files..."

          find . \
            -type f \
            -name "*.apk" \
            -print


      # ==========================================
      # 16. Verify APK
      # ==========================================
      - name: Verify APK
        shell: bash
        run: |

          APK_COUNT=$(find . -type f -name "*.apk" | wc -l)

          echo "APK count: $APK_COUNT"

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo "APK generated successfully."


      # ==========================================
      # 17. Upload APK
      # ==========================================
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-Debug-APK
          path: |
            app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
