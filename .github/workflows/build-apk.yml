name: Build LinguaX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout repository
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4

      # ==========================================
      # 2. Remove broken Gradle Wrapper
      # ==========================================
      - name: Remove Broken Gradle Wrapper
        shell: bash
        run: |
          echo "Checking Gradle Wrapper..."

          if [ -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Removing invalid gradle-wrapper.jar"
            rm -f gradle/wrapper/gradle-wrapper.jar
          fi

          if [ -f "gradlew" ]; then
            echo "Removing invalid gradlew"
            rm -f gradlew
          fi

          if [ -f "gradlew.bat" ]; then
            echo "Removing invalid gradlew.bat"
            rm -f gradlew.bat
          fi

          echo "Broken wrapper removed."

          echo ""
          echo "Remaining Gradle files:"
          find gradle -maxdepth 3 -type f 2>/dev/null || true

      # ==========================================
      # 3. Setup JDK 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ==========================================
      # 4. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ==========================================
      # 5. Setup Gradle
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      # ==========================================
      # 6. Configure Android SDK
      # ==========================================
      - name: Configure Android SDK
        shell: bash
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties

          echo "Android SDK configured:"
          cat local.properties

      # ==========================================
      # 7. Verify Android project
      # ==========================================
      - name: Verify Android Project
        shell: bash
        run: |
          echo "=========================================="
          echo "LinguaX Android Project"
          echo "=========================================="

          echo ""
          echo "Project root:"
          pwd

          echo ""
          echo "Root files:"
          ls -la

          echo ""
          echo "App directory:"
          ls -la app

          echo ""
          echo "Checking required files..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts

          echo ""
          echo "Required Gradle files found successfully."

      # ==========================================
      # 8. Check Gradle
      # ==========================================
      - name: Check Gradle Version
        run: |
          gradle --version

      # ==========================================
      # 9. Create debug keystore
      # ==========================================
      - name: Create Debug Keystore
        shell: bash
        run: |
          mkdir -p "$HOME/.android"

          rm -f "$HOME/.android/debug.keystore"

          keytool \
            -genkeypair \
            -v \
            -keystore "$HOME/.android/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          cp "$HOME/.android/debug.keystore" ./debug.keystore

          echo "Debug keystore created successfully."

          ls -lh debug.keystore

      # ==========================================
      # 10. Clean project
      # ==========================================
      - name: Clean Project
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace

      # ==========================================
      # 11. Build Debug APK
      # ==========================================
      - name: Build APK with Gradle
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all

      # ==========================================
      # 12. Find APK
      # ==========================================
      - name: Find APK
        shell: bash
        run: |
          echo "=========================================="
          echo "Searching for APK"
          echo "=========================================="

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          APK_COUNT=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" | wc -l)

          if [ "$APK_COUNT" -eq 0 ]; then
            echo "ERROR: No APK was generated."
            exit 1
          fi

          echo ""
          echo "APK generated successfully."

      # ==========================================
      # 13. Prepare APK
      # ==========================================
      - name: Prepare LinguaX APK
        shell: bash
        run: |
          mkdir -p release

          APK=$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            | head -n 1)

          cp "$APK" release/LinguaX-debug.apk

          echo "Final APK:"
          ls -lh release/LinguaX-debug.apk

      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: release/LinguaX-debug.apk
          if-no-files-found: error
          retention-days: 30
