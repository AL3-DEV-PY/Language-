name: Build LinguaX Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build LinguaX APK
    runs-on: ubuntu-latest

    steps:

      # ==========================================
      # 1. Checkout
      # ==========================================
      - name: Checkout Repository
        uses: actions/checkout@v4


      # ==========================================
      # 2. Java 17
      # ==========================================
      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      # ==========================================
      # 3. Setup Gradle directly
      #    Do NOT use ./gradlew
      # ==========================================
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false


      # ==========================================
      # 4. Setup Android SDK
      # ==========================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3


      # ==========================================
      # 5. Install Android SDK components
      # ==========================================
      - name: Install Android SDK Components
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"


      # ==========================================
      # 6. Configure Supabase
      # ==========================================
      - name: Configure Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -e

          if [ -z "$SUPABASE_URL" ]; then
            echo "ERROR: SUPABASE_URL GitHub Secret is missing."
            exit 1
          fi

          if [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "ERROR: SUPABASE_ANON_KEY GitHub Secret is missing."
            exit 1
          fi

          if [[ "$SUPABASE_URL" != https://*.supabase.co ]]; then
            echo "ERROR: SUPABASE_URL does not look like a valid Supabase URL."
            exit 1
          fi

          cat > .env <<EOF
          SUPABASE_URL=$SUPABASE_URL
          SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          VITE_SUPABASE_URL=$SUPABASE_URL
          VITE_SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY
          EOF

          echo "Supabase configuration created successfully."


      # ==========================================
      # 7. Create local.properties
      # ==========================================
      - name: Configure Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > local.properties


      # ==========================================
      # 8. Create debug keystore
      # ==========================================
      - name: Create Debug Keystore
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair \
              -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

          echo "Debug keystore ready."


      # ==========================================
      # 9. Verify Supabase configuration
      # ==========================================
      - name: Verify Supabase Configuration
        run: |
          echo "Checking Supabase configuration..."

          test -f .env

          grep -q "^SUPABASE_URL=https://" .env
          grep -q "^SUPABASE_ANON_KEY=" .env

          echo "Supabase configuration detected."


      # ==========================================
      # 10. Check Gradle
      # ==========================================
      - name: Check Gradle
        run: |
          java -version
          gradle --version


      # ==========================================
      # 11. Clean project
      # ==========================================
      - name: Clean Project
        run: |
          gradle clean \
            --no-daemon \
            --stacktrace


      # ==========================================
      # 12. Build APK
      # ==========================================
      - name: Build Debug APK
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          gradle :app:assembleDebug \
            --no-daemon \
            --stacktrace \
            --warning-mode all


      # ==========================================
      # 13. Verify APK
      # ==========================================
      - name: Verify APK
        run: |
          echo "Searching for APK..."

          find app/build/outputs/apk -type f -name "*.apk" -print

          test -f app/build/outputs/apk/debug/app-debug.apk

          echo "APK successfully created:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk


      # ==========================================
      # 14. Upload APK
      # ==========================================
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
