name: Build LinguaX APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # 3. Use Gradle 9.3.1
      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      # 4. Verify Java and Gradle versions
      - name: Verify build environment
        run: |
          java -version
          gradle --version

      # 5. Create debug keystore in the exact location
      # expected by app/build.gradle.kts
      - name: Create debug keystore
        run: |
          keytool -genkeypair \
            -v \
            -keystore "$GITHUB_WORKSPACE/debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"

          test -f "$GITHUB_WORKSPACE/debug.keystore"

          echo "Debug keystore created successfully:"
          ls -lh "$GITHUB_WORKSPACE/debug.keystore"

      # 6. Build Debug APK
      - name: Build APK
        run: |
          gradle :app:assembleDebug --stacktrace --no-daemon

      # 7. Verify APK
      - name: Verify APK
        run: |
          echo "Searching for generated APK..."

          find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print

          test -n "$(find app/build/outputs/apk \
            -type f \
            -name "*.apk" \
            -print -quit)"

      # 8. Show APK information
      - name: APK information
        run: |
          ls -lh app/build/outputs/apk/debug/*.apk

      # 9. Upload APK
      - name: Upload LinguaX APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaX-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
